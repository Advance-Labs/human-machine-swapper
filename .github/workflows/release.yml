name: release

# Publishes to npm when a vX.Y.Z tag is pushed. The tag must match the version in
# package.json, so a release cannot silently ship a different version than it claims.
#
# Authentication is npm Trusted Publishing (OIDC): the job proves it is this workflow, in
# this repo, and npm mints a short-lived credential for it. There is no NPM_TOKEN. That is
# the point - a publish token is a long-lived secret that works from anywhere, and the one
# this package started with was disclosed in plain text. It cannot be disclosed if it does
# not exist.
#
# Trusted publishing also attaches a provenance attestation to the release, so anyone can
# verify which commit and workflow produced the tarball: npm audit signatures.
on:
  push:
    # v* releases the component. create-v* releases the create-llms-txt front door.
    tags: ["v*", "create-v*"]

permissions:
  contents: read
  # What lets the job request the OIDC token npm trades for publish rights.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 22, not 20. Trusted publishing needs Node >= 22.14.0 AND npm >= 11.5.1, and
      # Node 20 satisfies neither: it ships npm 10, which has never heard of OIDC. Left
      # alone it would hunt for a token, find none, and fail with an auth error that says
      # nothing about the real cause.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Node and npm new enough for trusted publishing
        run: |
          npm install -g npm@latest
          echo "node $(node --version), npm $(npm --version)"
          node -e '
            const need = (got, min, what) => {
              const g = got.replace(/^v/, "").split(".").map(Number);
              const m = min.split(".").map(Number);
              for (let i = 0; i < 3; i++) {
                if (g[i] > m[i]) return;
                if (g[i] < m[i]) {
                  console.error(`::error::${what} ${got} cannot use trusted publishing; needs >= ${min}`);
                  process.exit(1);
                }
              }
            };
            need(process.version, "22.14.0", "node");
            need(process.argv[1], "11.5.1", "npm");
          ' "$(npm --version)"

      - run: npm test

      # Which package this tag is for. Keeping both in one repo means one source of truth
      # for the install logic; the tag prefix is what picks the target.
      - name: Pick the package from the tag
        id: target
        run: |
          case "$GITHUB_REF_NAME" in
            create-v*) DIR="create-llms-txt"; VERSION="${GITHUB_REF_NAME#create-v}" ;;
            v*)        DIR="."              ; VERSION="${GITHUB_REF_NAME#v}" ;;
            *)         echo "::error::unrecognised tag $GITHUB_REF_NAME"; exit 1 ;;
          esac
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p "require('./$DIR/package.json').name")" >> "$GITHUB_OUTPUT"
          echo "releasing $DIR at $VERSION"

      - name: Tag and package.json must agree
        run: |
          PKG="$(node -p "require('./${{ steps.target.outputs.dir }}/package.json').version")"
          if [ "${{ steps.target.outputs.version }}" != "$PKG" ]; then
            echo "::error::tag says ${{ steps.target.outputs.version }}, package.json says $PKG"
            exit 1
          fi

      # No NODE_AUTH_TOKEN. If this line ever needs one again, trusted publishing has been
      # turned off on npmjs.com and that is the thing to fix, not this file.
      #
      # Each package needs its OWN trusted publisher entry on npmjs.com, both pointing at
      # this repo and this workflow file.
      - run: npm publish
        working-directory: ${{ steps.target.outputs.dir }}

      # A green publish step is not proof the release is fetchable: npm answers before the
      # registry serves it ("your package is being processed"). And provenance is what shows
      # the publish really came from this workflow rather than from somebody's token.
      - name: Confirm the registry actually has it, with provenance
        env:
          SPEC: ${{ steps.target.outputs.name }}@${{ steps.target.outputs.version }}
        run: |
          for i in $(seq 1 30); do
            if npm view "$SPEC" version >/dev/null 2>&1; then
              echo "registry is serving $SPEC"
              npm view "$SPEC" dist.attestations || echo "::warning::no attestation for $SPEC"
              exit 0
            fi
            echo "waiting for the registry to serve $SPEC ($i)"
            sleep 10
          done
          echo "::error::published, but the registry never served $SPEC"
          exit 1
